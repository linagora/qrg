# QRG bundle patch for DSH 0.2.1-alpha.4, applied after the dsh-base and
# dsh-web-app layers of a profile created from the `web` template.
#
# qrg-router is split in two rows: the host row inserted below (decision
# engine, registry, sub-agent calls) and the `qrg-router-tools` row inside
# the standard and ptc agent presets. The bundle's second patch file,
# profile.patch.yml, holds the presets and every other QRG row: the
# installer also copies it into the profile, whose patch layer DSH applies
# even when it skips this bundle. Only this insert stays out of it, since
# inserting the same row twice would clash.

- insert:
    - id: qrg-router
      name: '@linagora/qrg-router'
      config:
        gateway: linagora
        fallbackModel: qwen3.8
