# QRG rows for DSH 0.2.1-alpha.4, in two places: the second patch file of
# the QRG bundle, and the patch layer of the `qrg` profile, into which the
# installer copies this file. DSH applies a profile's patch layer after
# every bundle, even when it skips a bundle whose `engines.dsh` does not
# cover its version: these rows then hold without the bundle, and only the
# qrg-router rows fail, delegation with them.
#
# Every row targets its entry by id alone. A patch whose `name` no longer
# matches its entry is skipped, which would leave a flow open; without a
# name, a renamed plugin receives the config and fails instead.

# The LINAGORA AI Gateway is a route of the pi-ai adapter that dsh-base
# mounts dormant. The route names the reference of its key, resolved per
# request by the credentials service: no key ever enters this file.
- id: llm-pi-ai
  config:
    providers:
      linagora:
        apiKeyEnv: LINAGORA_API_KEY
        api: openai-completions
        baseURL: https://ai-api.linagora.com/v1
        models:
          - id: qwen3.8

- id: agent-default-model
  config:
    provider: linagora
    model: qwen3.8

# Flows to DeepSeek. Session telemetry: the qrg launcher also sets
# DSH_TELEMETRY_DISABLED, with which DSH disables this row once more after
# every layer.
- id: session-telemetry-otel
  disabled: true

# The session log and the plugin inventory attached to official requests.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# The official routes and the DeepSeek account they act on, with the
# account API, which injects the account service, and its settings page.
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: deepseek-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-settings-account
  disabled: true

# DeepSeek web search: the web runtime keeps its HTTP fetch provider, and
# the web tool of the presets below drops `web_search`.
- id: web
  config:
    fetchProvider: http

- id: web-search-deepseek
  disabled: true

# Product telemetry of the desktop app. dsh-web-app disables these two
# rows in any profile not named `desktop`; here, whatever the name.
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# Delegation goes through route_and_delegate only: no fork provider, and no
# cordis preset, which would keep its own delegation group.
- id: subagent-fork-in-process
  disabled: true

- id: preset-cordis
  disabled: true

# Permissions without danger-full-access, which the dsh-base rows select
# from DSH_PERMISSION_MODE.
- id: sandbox-policy
  config:
    mode: workspace-write

- id: approval
  config:
    policy: ask

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask

# A patch cannot insert into a preset's `config.plugins`, so the standard
# and ptc rows take whole copies of the lists dsh-web-app 0.2.1-alpha.4
# ships, with two changes: the qrg-router tools row in place of the
# `delegation` group, and `search: false` on the web tool.
# tests/presets.test.ts compares these copies with the installed presets:
# redo them at every DSH bump.
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: qrg-router-tools
        name: '@linagora/qrg-router/tools'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
          search: false
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true

