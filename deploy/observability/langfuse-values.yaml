# Valeurs du chart langfuse/langfuse 2.1.4 (Langfuse 4.50.0) pour le lot 1 de QRG.
#
# Release `langfuse` dans le namespace `langfuse`. Aucun secret ici : tout vient
# du Secret `langfuse`, créé avant l'installation hors de toute session Claude
# (voir README.md, script creer-secrets.sh).
#
# À remplacer avant l'installation :
#   - langfuse.example.com : nom DNS de l'interface Langfuse ;
#   - admin@example.com : adresse du compte administrateur initial ;
#   - langfuse-tls : Secret TLS de l'ingress, à fournir ou à faire produire
#     par cert-manager (voir README.md).

langfuse:
  # Clés fixées dans le Secret `langfuse` plutôt que générées par le chart :
  # `helm template` et ArgoCD les régénéreraient à chaque rendu.
  salt:
    secretKeyRef:
      name: langfuse
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse
      key: encryption-key
  nextauth:
    url: https://langfuse.example.com
    secret:
      secretKeyRef:
        name: langfuse
        key: nextauth-secret

  features:
    # Aucune statistique d'usage envoyée à Langfuse.
    telemetryEnabled: false
    # Pas d'inscription libre : le seul compte est créé ci-dessous.
    signUpDisabled: true

  ingress:
    enabled: true
    # Vide : classe d'ingress par défaut du cluster.
    className: ""
    annotations: {}
    hosts:
      - host: langfuse.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: langfuse-tls

  # Initialisation sans interface : organisation, projet `qrg`, paire de clés du
  # projet et compte administrateur, créés au démarrage s'ils n'existent pas.
  # Le collecteur s'authentifie avec cette paire de clés. Langfuse ne lit ces
  # variables que dans le conteneur web (web/src/initialize.ts) : elles restent
  # hors du worker, qui ne reçoit ni le mot de passe administrateur ni la clé
  # secrète du projet.
  web:
    pod:
      additionalEnv:
        - name: LANGFUSE_INIT_ORG_ID
          value: linagora
        - name: LANGFUSE_INIT_ORG_NAME
          value: LINAGORA
        - name: LANGFUSE_INIT_PROJECT_ID
          value: qrg
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: QRG
        - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse
              key: project-public-key
        - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse
              key: project-secret-key
        - name: LANGFUSE_INIT_USER_EMAIL
          value: admin@example.com
        - name: LANGFUSE_INIT_USER_NAME
          value: Administrateur QRG
        - name: LANGFUSE_INIT_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse
              key: admin-password

# Banques de données embarquées, sur le modèle de l'exemple minimal du chart :
# un seul Secret `langfuse` alimente Postgres, Valkey, ClickHouse et SeaweedFS.
postgresql:
  auth:
    existingSecret: langfuse
    secretKeys:
      # Mot de passe de l'utilisateur `langfuse` de l'application.
      userPasswordKey: postgresql-password
      # Documentée pour le super-utilisateur, mais lue par aucun gabarit du
      # chart 2.1.4 : le sous-chart Postgres lit directement la clé
      # POSTGRES_PASSWORD, distincte du mot de passe de l'application.
      adminPasswordKey: POSTGRES_PASSWORD
  settings:
    existingSecret: langfuse
  userDatabase:
    existingSecret: langfuse

redis:
  auth:
    existingSecret: langfuse
    existingSecretPasswordKey: redis-password
    usersExistingSecret: langfuse

clickhouse:
  auth:
    existingSecret: langfuse
    existingSecretKey: clickhouse-password
  cluster:
    logger:
      level: information
  keeper:
    # Un seul nœud Keeper suffit au lot 1 ; 3 pour la haute disponibilité.
    replicas: 1
    logger:
      level: information

s3:
  auth:
    existingSecret: langfuse
    rootUserSecretKey: s3-user
    rootPasswordSecretKey: s3-password
  allInOne:
    s3:
      existingConfigSecret: langfuse
